name: Test sh script through github actions

on:
  workflow_dispatch

jobs:
  execute-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install minimal GNOME components
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell xvfb dbus-x11 pipx

      - name: Find and inject gext PATH
        run: |
          # pipxのバイナリ保存先（PIPX_BIN_DIR）を自動取得して GitHub のパスに追加
          PIPX_BIN=$(pipx environment | grep PIPX_BIN_DIR | cut -d'=' -f2)
          echo "$PIPX_BIN" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 完全にステップを分離してパスを反映
      - name: Execute script inside virtual desktop session
        run: |
          chmod +x ./ubuntu-human.sh
          
          # パスが通っているかどこにあるかを確認（デバッグ用）
          echo "=== Locate gext ==="
          which gext || find / -name gext -type f 2>/dev/null | grep bin || true
          
          # スクリプトを実行
          echo "=== Running script ==="
          dbus-run-session -- xvfb-run --server-num=99 -s "-ac" ./ubuntu-human.sh

name: Test sh script through github actions

on:
  workflow_dispatch

jobs:
  execute-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install minimal GNOME components
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell xvfb dbus-x11 pipx

      - name: Ensure gnome-extensions-cli is installed
        run: |
          # pipx がデフォルトで使用するグローバル・ユーザーパスを環境変数に反映
          echo "/opt/pipx/venvs/gnome-extensions-cli/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # パスを反映させるため、ステップを完全に切り離します
      - name: Execute script inside virtual desktop session
        run: |
          chmod +x ./ubuntu-human.sh
          
          # フルパスを指定してテストを実行
          echo "=== Testing gext version ==="
          dbus-run-session -- xvfb-run --server-num=99 -s "-ac" /opt/pipx/venvs/gnome-extensions-cli/bin/gext --version || true
          
          # スクリプトを実行
          echo "=== Running script ==="
          dbus-run-session -- xvfb-run --server-num=99 -s "-ac" ./ubuntu-human.sh

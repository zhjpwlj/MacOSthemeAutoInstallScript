name: Test sh script though github actions
on: workflow_dispatch
jobs:
  execute-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install minimal GNOME components
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell xvfb dbus-x11

      - name: Execute script inside virtual desktop session
        run: |
          chmod +x ./ubuntu-human.sh
          # 仮想ディスプレイとD-Busセッションを起動してスクリプトを実行
          xvfb-run -a dbus-run-session ./ubuntu-human.sh

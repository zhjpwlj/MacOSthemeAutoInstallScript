name: Test sh script through github actions

on:
  workflow_dispatch

jobs:
  execute-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install minimal GNOME components & Python pip
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # pipx の代わりに python3-pip をインストール
          sudo apt-get install -y --no-install-recommends gnome-shell xvfb dbus-x11 python3-pip

      - name: Install gnome-extensions-cli via pip globally
        run: |
          # システム標準のパス（/usr/local/bin）に直接 gext を配置します。
          # これによりパスの設定を一切せずとも「gext」コマンドが確実に動くようになります。
          sudo pip3 install --break-system-packages gnome-extensions-cli

      - name: Execute script inside virtual desktop session
        run: |
          chmod +x ./ubuntu-human.sh
          
          echo "=== Testing gext version ==="
          dbus-run-session -- xvfb-run --server-num=99 -s "-ac" gext --version
          
          echo "=== Running script ==="
          dbus-run-session -- xvfb-run --server-num=99 -s "-ac" ./ubuntu-human.sh

name: Test sh script though github actions

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  execute-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: install gnome
        run: sudo apt update && sudo apt install xorg ubuntu-desktop -y

      - name: Make script executable
        run: chmod +x ./Ubuntu.sh

      - name: Execute the shell script
        run: ./Ubuntu.sh -y

name: Test sh script through github actions

on:
  workflow_dispatch

jobs:
  execute-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install minimal GNOME components
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell xvfb dbus-x11 pipx

      - name: Ensure gnome-extensions-cli is installed
        run: |
          echo "/opt/pipx/venvs/gnome-extensions-cli/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Execute script inside virtual desktop session
        run: |
          chmod +x ./ubuntu-human.sh
          
          # 1. そもそも gext コマンドがこの環境で正常に動くか単体テスト
          echo "=== Testing gext version ==="
          dbus-run-session -- xvfb-run --server-num=99 -s "-ac" gext --version
          
          # 2. スクリプトをデバッグモード（-x）で実行し、どの行で落ちたか出力させる
          echo "=== Running script ==="
          dbus-run-session -- xvfb-run --server-num=99 -s "-ac" bash -x ./ubuntu-human.sh
